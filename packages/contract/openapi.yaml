openapi: 3.1.0
info:
  title: Geospatial
  version: 0.1.0
  summary: The API of the Geospatial extension for Directus.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: '{publicUrl}'
    description: The Directus the extension runs in.
    variables:
      publicUrl:
        default: http://localhost:8055
        description: The PUBLIC_URL of that Directus.
paths:
  /geospatial/capabilities:
    get:
      operationId: capabilities
      summary: What the extension can do in this environment
      description: >-
        The versions of the API, the extension and Directus, and the capability matrix: the level of each operation
        in the database in use. Only admins see the database and its spatial extension. Anonymous requests are
        refused.
      security:
        - bearer: []
      responses:
        '200':
          description: The capabilities.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Capabilities'
        '403':
          description: The request has no authenticated user (code FORBIDDEN).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '503':
          description: >-
            The database did not answer, so the extension cannot tell what it can do (code
            GEOSPATIAL_DATABASE_UNAVAILABLE). The route answers again as soon as the database is back.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
  /geospatial/items/{collection}:
    get:
      operationId: items
      summary: The items of a collection that a spatial operation selects
      description: >-
        The format of /items of Directus, with the parameter geo for the spatial operation. The items come out of the
        query Directus builds of what the user can read, with the filter and the search of the request, so a user only
        ever receives the items /items would give them. The values come as /items gives them, converted by Directus:
        the geometry in GeoJSON, a concealed field hidden, and the booleans, the JSON, the CSV and the dates in their
        format.
      security:
        - bearer: []
        - {}
      parameters:
        - name: collection
          in: path
          required: true
          description: The collection, by its name in Directus.
          schema:
            type: string
        - name: geo
          in: query
          required: true
          description: The spatial operation, as JSON, the way Directus takes the filter.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Geo'
        - name: fields
          in: query
          description: >-
            The fields of each item, as in /items, separated by commas. Fields of a relation are refused for now. The
            geometry the operation reads is always read by its name, so a user who cannot read it gets the error of
            /items.
          schema:
            type: string
        - name: filter
          in: query
          description: The filter of /items, as JSON.
          content:
            application/json:
              schema:
                type: object
        - name: search
          in: query
          description: The search of /items.
          schema:
            type: string
        - name: limit
          in: query
          description: How many items, as in /items, with -1 for all of them.
          schema:
            type: integer
            minimum: -1
        - name: offset
          in: query
          description: How many items to skip, in the order of the primary key.
          schema:
            type: integer
            minimum: 0
        - name: page
          in: query
          description: The page, as in /items, starting at 1.
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: The items, in the order of the primary key.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Item'
        '400':
          description: >-
            The geo is off the contract, or the request carries a parameter the operation does not take yet (code
            INVALID_QUERY of Directus).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '403':
          description: >-
            The user cannot read the collection, a field the request asks for or the geometry, or the collection is one
            of the system, as in /items (code FORBIDDEN). On Directus 12, an inactive collection, to a user who can read
            it (code COLLECTION_INACTIVE).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '501':
          description: >-
            The operation does not run on the database in use (code GEOSPATIAL_OPERATION_UNAVAILABLE), with the
            operation and the reason in the extensions of the error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '503':
          description: >-
            The internals of the running Directus are not the ones the extension expects, so its operations are off
            (code GEOSPATIAL_INTERNALS_UNSUPPORTED), or the database did not answer (code
            GEOSPATIAL_DATABASE_UNAVAILABLE).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
  /geospatial/openapi.json:
    get:
      operationId: openapi
      summary: This document, in JSON
      description: >-
        The contract of the API, as OpenAPI 3.1: the same document the types of the SDK and the validation of the input
        come from. Anonymous requests are refused, since it carries the version of the API.
      security:
        - bearer: []
      responses:
        '200':
          description: The OpenAPI document.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenApiDocument'
        '403':
          description: The request has no authenticated user (code FORBIDDEN).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: A Directus access token. The session cookie of the Studio also works.
  schemas:
    Capabilities:
      type: object
      required: [api, extension, directus, operations]
      properties:
        api:
          $ref: '#/components/schemas/Version'
        extension:
          $ref: '#/components/schemas/Version'
        directus:
          $ref: '#/components/schemas/Version'
        database:
          $ref: '#/components/schemas/Database'
        spatial:
          description: Only for admins. Null when the database has no spatial extension.
          oneOf:
            - $ref: '#/components/schemas/Spatial'
            - type: 'null'
        operations:
          description: The level of each operation, by its id. Empty until the first operation exists.
          type: object
          additionalProperties:
            $ref: '#/components/schemas/OperationCapability'
        internals:
          $ref: '#/components/schemas/Internals'
    Internals:
      description: >-
        Only for admins. Whether the internals of the running Directus, which the operations build the permitted query
        with, are the ones an adapter of the extension expects, as the check found them when the extension started.
        When no adapter passes, the operations are off.
      oneOf:
        - $ref: '#/components/schemas/InternalsAccepted'
        - $ref: '#/components/schemas/InternalsRefused'
    InternalsAccepted:
      type: object
      required: [status, adapter]
      properties:
        status:
          type: string
          const: accepted
        adapter:
          description: The adapter that the running Directus passed, named after the Directus version it was written for.
          type: string
          enum: ['11.17', '12']
    InternalsRefused:
      type: object
      required: [status, problems]
      properties:
        status:
          type: string
          const: refused
        problems:
          description: What the running Directus lacks, or has besides, of what each adapter expects, by adapter.
          type: object
          additionalProperties:
            type: array
            items:
              type: string
    OpenApiDocument:
      description: An OpenAPI 3.1 document, as the OpenAPI Specification describes it.
      type: object
      required: [openapi, info, paths]
      properties:
        openapi:
          type: string
          pattern: ^3\.1\.\d+$
        info:
          type: object
          required: [title, version]
          properties:
            title:
              type: string
            version:
              type: string
        paths:
          type: object
    Version:
      type: object
      required: [version]
      properties:
        version:
          type: string
    Database:
      description: Only for admins.
      type: object
      required: [client, version]
      properties:
        client:
          description: The database client, with the names Directus uses, or unknown when the extension does not recognize it.
          type: string
          enum: [mysql, postgres, cockroachdb, sqlite, oracle, mssql, redshift, unknown]
        version:
          description: The version as major.minor, or null when the extension cannot read it for this client yet.
          type: [string, 'null']
    Spatial:
      type: object
      required: [name, version]
      properties:
        name:
          type: string
          enum: [postgis, spatialite]
        version:
          type: string
    OperationCapability:
      type: object
      required: [level]
      properties:
        level:
          description: >-
            indexed and unindexed run in the database, with or without a spatial index; capped runs in the server of
            the extension, on a maximum volume; unavailable does not run.
          type: string
          enum: [indexed, unindexed, capped, unavailable]
        reason:
          description: Why the operation is unavailable, without naming the database.
          type: string
    Geo:
      description: The spatial operation of a request, by its id, the canonical term of the glossary in camelCase.
      oneOf:
        - $ref: '#/components/schemas/Radius'
      discriminator:
        propertyName: operation
        mapping:
          radius: '#/components/schemas/Radius'
    Radius:
      description: >-
        The items within a distance of a point, in meters over the ellipsoid. An item is inside when any part of it is
        at most at the distance, the edge included.
      type: object
      required: [operation, center, distance]
      additionalProperties: false
      properties:
        operation:
          type: string
          const: radius
        field:
          description: >-
            The geometry field of the collection the operation reads. It may be left out when the collection has a single
            geometry field.
          type: string
          minLength: 1
        center:
          $ref: '#/components/schemas/Position'
        distance:
          description: The distance, in meters.
          type: number
          exclusiveMinimum: 0
    Position:
      description: A point as [longitude, latitude], in WGS 84, as GeoJSON writes it.
      type: array
      prefixItems:
        - type: number
          minimum: -180
          maximum: 180
        - type: number
          minimum: -90
          maximum: 90
      items: false
      minItems: 2
    Item:
      description: >-
        An item of the collection, with the fields the request asks for, the geometries in GeoJSON and the other values
        as the database returns them.
      type: object
    ErrorCode:
      description: >-
        The codes of the errors of the extension, in the extensions.code of the error format of Directus. Each one
        starts with GEOSPATIAL_, so it never collides with a code of Directus.
      type: string
      enum: [GEOSPATIAL_DATABASE_UNAVAILABLE, GEOSPATIAL_INTERNALS_UNSUPPORTED, GEOSPATIAL_OPERATION_UNAVAILABLE]
    Errors:
      description: The error format of Directus.
      type: object
      required: [errors]
      properties:
        errors:
          type: array
          items:
            type: object
            required: [message, extensions]
            properties:
              message:
                type: string
              extensions:
                type: object
                required: [code]
                properties:
                  code:
                    description: A code of the extension, or one of Directus, such as FORBIDDEN.
                    anyOf:
                      - $ref: '#/components/schemas/ErrorCode'
                      - type: string
