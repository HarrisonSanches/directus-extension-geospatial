packages:
  - packages/*
  # Another extension for the integration suite, which loads beside the extension.
  - test/hook
  # The extension of the measurements, which times the reads of the radius inside Directus.
  - test/measure/observer

catalog:
  # Checks the types of the published SDK against each way a project resolves it (CommonJS, ESM, bundlers).
  '@arethetypeswrong/cli': 0.18.5
  # The docs site (D-060), on Astro.
  '@astrojs/starlight': 0.42.6
  '@commitlint/cli': 21.2.4
  '@commitlint/config-conventional': 21.2.4
  '@commitlint/lint': 21.2.4
  '@commitlint/load': 21.2.4
  '@commitlint/types': 21.2.3
  '@directus/errors': 3.0.0
  '@directus/extensions-sdk': 18.0.6
  # The version released with Directus 12.5.0, the newest the integration suite runs. The SDK of the extension also
  # runs its unit tests and its types against the oldest one its peer accepts, directus-sdk-oldest below (V-191).
  '@directus/sdk': 27.0.0
  # The version the extensions SDK depends on, so both read the same types.
  '@directus/types': 18.0.0
  '@eslint/js': 10.0.1
  # The property tests (docs/padroes/testes.md), with fast-check, each property run as a test of Vitest.
  '@fast-check/vitest': 0.5.0
  '@hey-api/openapi-ts': 0.99.0
  # The lint of the contract (D-016), one package with no dependencies of its own.
  '@redocly/cli': 2.66.0
  # The reference of the API in the docs site, the one renderer that reads the SEARCH of OpenAPI 3.2 (D-060, V-194).
  '@scalar/api-reference': 1.75.1
  # The mutation testing of the golden rule (docs/padroes/testes.md), and the types of its options, of one version.
  '@stryker-mutator/api': 10.0.0
  '@stryker-mutator/core': 10.0.0
  '@testcontainers/postgresql': 12.2.1
  '@types/node': 24.19.2
  # TypeScript runs side by side (V-90): this alias is the TypeScript 7 behind tsc, and the typescript name below
  # serves the 6.0 API that typescript-eslint loads, until typescript-eslint supports TypeScript 7 (P-25).
  '@typescript/native': npm:typescript@7.0.2
  '@vitest/coverage-v8': 5.0.5
  # The coverage libraries @vitest/coverage-v8 5.0.2 uses, so the coverage from inside Directus is converted and summed
  # the same way as the one from the unit tests.
  '@vitest/istanbul-lib-coverage': 1.0.2
  '@vitest/istanbul-lib-report': 1.0.2
  # The validation by the JSON Schema of the contract, in the dialect of OpenAPI 3.1 (D-016).
  ajv: 8.20.0
  ast-v8-to-istanbul: 1.0.7
  astro: 7.3.8
  # The version Directus 11.17 and 12 use, whose functions move a $NOW of the registered query as the adjustDate of
  # Directus does (V-182).
  date-fns: 4.4.0
  # The oldest @directus/sdk the peer of the SDK of the extension accepts, under a name of its own, beside the newest
  # one above. It moves with the peer, by hand (V-191).
  directus-sdk-oldest: npm:@directus/sdk@26.0.0
  eslint: 10.13.0
  eslint-config-prettier: 10.1.8
  eslint-plugin-import-x: 4.17.1
  # The geodesics of Karney, the same calculation as PostGIS on the ellipsoid (V-42), for the answers the tests expect.
  geographiclib-geodesic: 2.2.0
  husky: 9.1.7
  jiti: 2.7.0
  # The exact version Directus uses and @directus/types names as its peer.
  knex: 3.1.0
  knip: 6.42.1
  # The exact version @directus/types names as its optional peer, for the type of the logger.
  pino: 9.7.0
  prettier: 3.9.10
  # The format of the .astro pages of the docs site.
  prettier-plugin-astro: 1.1.1
  # Checks the package.json of the published SDK against how Node and the bundlers read it.
  publint: 0.3.25
  # Fails the build of the docs site on a broken link.
  starlight-links-validator: 0.27.0
  testcontainers: 12.2.1
  # The build of the SDK, as in the packages of Directus (V-59).
  tsdown: 0.23.1
  typescript: npm:@typescript/typescript6@6.0.2
  typescript-eslint: 8.72.0
  vite: 8.3.5
  vitest: 5.0.5
  yaml: 2.9.1

catalogs:
  # The code of the extension runs in the Node of the Directus images, the 22 (V-80), so its types come from that line.
  node22:
    '@types/node': 22.20.5

# pnpm add only accepts versions from the catalog, so the repository keeps one version of each dependency.
catalogMode: strict

# Dependency build scripts are denied by default, and strictDepBuilds (on by default) fails the install when a
# package with one is missing here. Each entry is a reviewed decision: true runs its scripts, false skips them.
allowBuilds:
  # Its postinstall only downloads the native binding when the package manager skipped the optional dependency for
  # the platform, and pnpm installs it.
  unrs-resolver: false
  # The same: with the platform package installed, it only swaps the command shim for the native binary.
  esbuild: false
  # It only switches the library to Vue 2, and the version it ships is the one for Vue 3.
  vue-demi: false
  # testcontainers reaches Docker through ssh2 only when Docker runs on another machine over SSH. Its install script
  # only tries to compile an optional crypto binding with node-gyp, and ssh2 falls back to JavaScript without it.
  ssh2: false
  # A native addon that ssh2 lists as optional, to pick its ciphers; ssh2 works without it.
  cpu-features: false
  # Its postinstall only warns when a dependent declares an incompatible version scheme of it.
  protobufjs: false

# The extensions SDK of Directus 18.0.6 ships Vite 8 with @vitejs/plugin-vue 6.0.1, which accepts Vite only up to 7.
# The plugin declares Vite 8 from 6.0.5 on, in the same 6.0 line.
overrides:
  '@directus/extensions-sdk>@vitejs/plugin-vue': 6.0.10
  # GHSA-52cp-r559-cp3m, GHSA-5p4m-2wfm-xmqj and GHSA-2883-xcg3-v3hh: the generator of the contract types pins a
  # version of js-yaml that a crafted YAML drives to quadratic CPU use, fixed in the same line.
  'js-yaml@>=4.0.0 <4.3.2': 4.3.2
  # GHSA-q8mj-m7cp-5q26, GHSA-x5fp-wj9c-mxmx and GHSA-4mjr-xmp4-gh2g: the client of the dashboard of Stryker pins a
  # version of qs these advisories reach, fixed in the same major. The mutation testing never sends its report there.
  'qs@>=2.2.5 <6.16.0': 6.16.1
  # GHSA-866g-f22w-33x8: the AI chat of Scalar, which the docs site turns off (D-060), pins a version of the
  # provider-utils of the AI SDK this advisory reaches, fixed in the same line.
  '@ai-sdk/provider-utils@>=4.0.0-beta.10 <4.0.33': 4.0.62
  # GHSA-rj75-hqrm-r3gf: the code blocks of Starlight nest their CSS at build time with postcss-nested 6, whose
  # postcss-selector-parser 6 this advisory reaches, fixed only in the 7. The postcss-nested 7 moved to it, and the CSS
  # of the docs site comes out the same.
  '@expressive-code/core>postcss-nested': 7.0.2

# Dependencies that these packages use in their type declarations and do not declare. pnpm then resolves them from
# its hidden hoisting folder, where typescript is the TypeScript 7 package, which has no API, and type-fest is missing.
packageExtensions:
  '@typescript-eslint/types':
    peerDependencies:
      typescript: '>=4.8.4 <6.1.0'
  # Its sandbox reads the tsconfig through the API of TypeScript, which it imports without declaring (V-193).
  '@stryker-mutator/core':
    peerDependencies:
      typescript: '>=3.6'
  eslint-import-context:
    dependencies:
      type-fest: ^4.41.0

# A version published less than 3 days ago (4320 minutes) is not installed, giving the registry and the community
# time to find and pull a compromised release.
minimumReleaseAge: 4320

# pnpm does not switch itself to the packageManager version: switching records pnpm in a first lockfile document,
# and the GitHub dependency graph reads only that one (V-93). engines.pnpm refuses any other pnpm instead.
pmOnFail: ignore

# Refuses a pnpm outside engines.pnpm, and any dependency that does not support the Node version in use.
engineStrict: true
