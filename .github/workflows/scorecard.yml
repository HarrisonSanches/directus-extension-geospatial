# The OpenSSF Scorecard of the repository (V-76): it measures the security practices of the project, sends the
# findings to code scanning and publishes the score the badge of the README reads. It runs on develop, the default
# branch, because the result is only published from there. With publish_results, the Scorecard API accepts the result
# only from a job with no env, defaults, containers or services, and with steps from its list of actions (V-135).
name: Scorecard

on:
  push:
    branches: [develop]
  schedule:
    # Mondays at 04:00 in São Paulo, after the nightly run.
    - cron: '0 7 * * 1'

permissions:
  contents: read

# A new push to develop waits for the analysis of the one before, which publishes its result first.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read # checks out the repository
      security-events: write # uploads the findings to code scanning
      id-token: write # signs the result that the Scorecard API publishes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
