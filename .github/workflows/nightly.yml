# The checks of CI every night on develop, the default branch, with the newest PostGIS added to the integration suite
# (D-037). It also runs by hand, from the Actions tab.
name: Nightly

on:
  schedule:
    # 03:00 in São Paulo.
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: CI with the combinations of the night
    uses: $/.github/workflows/ci.yml
    with:
      combinations: nightly
    secrets:
      DIRECTUS_LICENSE_KEY: ${{ secrets.DIRECTUS_LICENSE_KEY }}
