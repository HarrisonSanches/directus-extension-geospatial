# The analysis of SonarQube Cloud, which the coverage job of CI runs on every push and pull request, with the quality
# gate as a status that the ruleset of develop requires.
sonar.organization=harrisonsanches
sonar.projectKey=HarrisonSanches_directus-extension-geospatial

# The code the coverage measures, the same the Vitest configuration includes, with its unit tests beside it: the
# extension, the contract, the SDK and the docs site (A-075).
sonar.sources=packages/extension/src,packages/contract/src,packages/sdk/src,packages/docs/src,dev
sonar.tests=packages/extension/src,packages/contract/src,packages/sdk/src,packages/docs/src,dev,test
sonar.test.inclusions=**/*.test.ts
sonar.exclusions=**/*.test.ts,packages/contract/src/generated/**

# The declarations only describe what Directus attaches, so they have nothing to cover, and the collections of the
# docs site are a config that only Astro loads, as the Vitest configuration says.
sonar.coverage.exclusions=**/*.d.ts,packages/docs/src/content.config.ts

# The unit coverage summed with the one recorded inside Directus by the integration suite (test/coverage.ts).
sonar.javascript.lcov.reportPaths=coverage/all/lcov.info
